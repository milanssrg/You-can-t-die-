<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YOU CAN'T DIE — v0.4 PRO</title>
<style>
:root{--ink:#19140f;--paper:#d6c39a;--edge:#715f46;--panel:#17130ee8}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0e0b;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#rotate{position:fixed;inset:0;z-index:500;background:#15120e;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate .box{max-width:420px;border:2px solid #7f6a4e;background:#201a14;border-radius:20px;padding:24px}
#rotate .phone{font-size:62px;display:block;transform:rotate(90deg);margin:10px}
#splash{position:fixed;inset:0;z-index:450;background:#0b0b0a center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:7vh 14vw}
#splash:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000c)}
#splashInner{z-index:2;position:relative;width:min(560px,60vw);text-align:center}
#loadbar{height:10px;border:2px solid #d6c49c;border-radius:12px;background:#201a14;overflow:hidden}
#loadfill{height:100%;width:0;background:#d6c49c}
#start{position:fixed;inset:0;z-index:420;background:#000b;display:none;align-items:center;justify-content:center}
.panel{width:min(620px,72vw);background:#17130ff2;border:2px solid #7d694c;border-radius:20px;padding:18px;text-align:center;box-shadow:0 20px 60px #0009}
.panel h1{font-family:Georgia,serif;letter-spacing:3px;margin:0 0 5px;font-size:32px}
.toolrow{display:flex;gap:10px;justify-content:center;margin-top:15px}
button{font:700 14px system-ui;color:#eee;background:#2a241cdd;border:1px solid #806c50;border-radius:12px;padding:10px 13px}
button:active{transform:scale(.97)}

#hud{position:fixed;inset:0;z-index:100;pointer-events:none}
#day{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));background:#17130fdd;border:1px solid #746247;border-radius:12px;padding:7px 10px;font:bold 12px system-ui}
#stats{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:6px}
.stat{height:40px;min-width:66px;background:#17130fdf;border:1px solid #746247;border-radius:12px;display:flex;align-items:center;gap:5px;padding:4px 8px;font:bold 12px system-ui}
.ico{font-size:18px;line-height:1}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:108px;height:108px;border:2px solid #c2ae8050;border-radius:50%;background:#18201866;pointer-events:auto}
#knob{position:absolute;width:44px;height:44px;left:30px;top:30px;border-radius:50%;background:#b8a477c9;border:2px solid #241c14}
#actions{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,54px);gap:7px;pointer-events:auto}
.act{width:54px;height:54px;border-radius:50%;padding:0;font-size:23px;background:#17130fe2}
#run{grid-column:1/3;height:38px;border-radius:19px}#craftBtn{height:38px;border-radius:19px}
#nearLabel{position:absolute;left:50%;bottom:85px;transform:translateX(-50%);background:#16120dcc;border:1px solid #6d5c44;border-radius:10px;padding:6px 9px;font:11px system-ui;opacity:0;transition:.15s}
#nearLabel.show{opacity:1}
#inventory{position:fixed;left:50%;bottom:12px;transform:translate(-50%,140%);z-index:150;background:#17130ff0;border:1px solid #7b684d;border-radius:12px;padding:7px;transition:.22s;pointer-events:auto}
#inventory.open{transform:translate(-50%,0)}
#slots{display:grid;grid-template-columns:repeat(8,44px);gap:5px}
.slot{width:44px;height:44px;background:#282119;border:1px dashed #76654c;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;font:9px system-ui;padding:2px}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:160;background:#15110def;border:1px solid #756146;border-radius:10px;padding:7px 10px;font:12px system-ui;opacity:0;transition:.2s}
#toast.show{opacity:1}
#dialog{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(620px,70vw);z-index:170;background:#17130ff5;border:2px solid #756146;border-radius:14px;padding:13px;display:none;pointer-events:auto}
#craft{position:fixed;inset:8vh 15vw;z-index:180;background:#15120ff7;border:2px solid #786448;border-radius:16px;padding:15px;display:none;overflow:auto;pointer-events:auto}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #473c2d}
#mapPanel{position:fixed;inset:7vh 10vw;z-index:190;background:#d3c29e;color:#251f17;border:4px solid #403428;border-radius:16px;padding:14px;display:none;pointer-events:auto}
#mapArt{height:68%;border:2px dashed #6b5940;border-radius:12px;background:radial-gradient(circle at 24% 58%,#47463f 0 10%,transparent 11%),radial-gradient(circle at 58% 36%,#6e815b 0 20%,transparent 21%),linear-gradient(125deg,#b99764 0 58%,#527b7f 59% 67%,#b99764 68%)}
</style>
</head>
<body>
<div id="rotate"><div class="box"><span class="phone">📱</span><h2>Vira el teléfono</h2><p>YOU CAN'T DIE se juega en horizontal.</p></div></div>
<canvas id="c"></canvas>
<div id="splash"><div id="splashInner"><div style="margin-bottom:7px">Cargando Mundo 1...</div><div id="loadbar"><div id="loadfill"></div></div></div></div>
<div id="start"><div class="panel"><h1>YOU CAN'T DIE</h1><p>Prototype v0.4</p><p style="opacity:.75">Elige una herramienta inicial para esta prueba.</p><div class="toolrow"><button data-tool="scissors">✂️ Tijeras<br>20 usos</button><button data-tool="axe">🪓 Hacha<br>20 usos</button><button data-tool="pick">⛏️ Pico<br>20 usos</button></div></div></div>

<div id="hud">
<div id="day">Día 1 · Mañana</div>
<div id="stats">
<div class="stat"><span class="ico">❤️</span><span id="hp">500</span></div>
<div class="stat"><span class="ico">🍖</span><span id="hunger">100</span></div>
<div class="stat"><span class="ico">⚡</span><span id="energy">100</span></div>
<div class="stat"><span class="ico">💧</span><span id="thirst">100</span></div>
<div class="stat"><span class="ico">⚰️</span><span id="deaths">0/100</span></div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="actions">
<button class="act" id="interact">🖐️</button><button class="act" id="attack">⚔️</button><button class="act" id="invBtn">🧰</button>
<button class="act" id="mapBtn">🗺️</button><button id="run">🏃 CORRER</button><button id="craftBtn">🛠️</button>
</div>
<div id="nearLabel"></div>
</div>
<div id="inventory"><div id="slots"></div></div>
<div id="toast"></div><div id="dialog"></div><div id="craft"></div>
<div id="mapPanel"><h3>🗺️ Mapa del Mundo 1</h3><div id="mapArt"></div><p>Cementerio · Valle · Bosque antiguo · Río · Montañas</p><button onclick="closeMap()">Cerrar</button></div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let DPR=Math.min(2,devicePixelRatio||1);
function resize(){canvas.width=innerWidth*DPR;canvas.height=innerHeight*DPR;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(DPR,0,0,DPR,0,0);document.getElementById('rotate').style.display=innerHeight>innerWidth?'flex':'none'}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

const names=['raven','kako','peacock','araucaria','cycad','ginkgo','fern_tree','berry_bush','grass','copper_rock','silver_rock','gold_rock','campfire','workbench','fern_root'],A={};
for(const n of names){let i=new Image();i.src=n+'.png';A[n]=i}

const W={w:3600,h:2400};let cam={x:610,y:640,tx:610,ty:640,zoom:1.02,rot:0};
let P={x:610,y:640,hp:500,hunger:100,energy:100,thirst:100,deaths:0,tool:null,uses:20,actions:0,face:1,walk:0};
const coffin={x:610,y:650},kako={x:920,y:650};let bird={x:1370,y:860,hp:100,agg:false,until:0,last:0};
let started=false,runHeld=false,mapUnlocked=false,inv=[],invTimer,last=performance.now(),day0=performance.now(),spawnAt=performance.now(),thA=0,huA=0,starveA=0;

function R(type,x,y,o={}){return {type,x,y,on:true,hits:0,regenAt:0,...o}}
let resources=[
R('grass',980,820,{kind:'hand',drop:['Hierba','Hierba','Hierba'],regen:600000,label:'Hierba'}),
R('grass',1110,940,{kind:'hand',drop:['Hierba','Hierba','Hierba'],regen:600000,label:'Hierba'}),
R('berry_bush',1240,760,{kind:'scissors',drop:['Mora','Mora','Mora'],regen:600000,label:'Moras'}),
R('berry_bush',1450,930,{kind:'scissors',drop:['Mora','Mora','Mora'],regen:600000,label:'Moras'}),
R('araucaria',1660,640,{kind:'axe',need:5,drop:['Madera','Madera','Madera','Madera','Madera'],label:'Araucaria'}),
R('araucaria',1870,780,{kind:'axe',need:5,drop:['Madera','Madera','Madera','Madera','Madera'],label:'Araucaria'}),
R('ginkgo',1510,1130,{kind:'axe',need:3,drop:['Madera','Madera','Hoja Ginkgo','Hoja Ginkgo','Hoja Ginkgo'],label:'Ginkgo Antiguo'}),
R('cycad',1150,1210,{kind:'axe',need:3,drop:['Tejido vegetal','Tejido vegetal','Tejido vegetal'],label:'Cícada'}),
R('fern_tree',1830,1240,{kind:'axe',need:5,drop:['Madera','Madera','Madera','Fronda helecho','Fronda helecho','Fronda helecho'],label:'Helecho arbóreo'}),
R('copper_rock',2110,830,{kind:'pick',need:5,drop:['Cobre','Cobre','Cobre'],label:'Roca de cobre'}),
R('silver_rock',2290,1020,{kind:'pick',need:5,drop:['Plata','Plata','Plata'],label:'Roca de plata'}),
R('fern_root',1740,1480,{kind:'scissors',drop:['Raíz Helecho'],regen:900000,label:'Raíz de Helecho'})
];
let structures=[{type:'workbench',x:1030,y:630,label:'Mesa de Trabajo'},{type:'campfire',x:1125,y:710,expires:performance.now()+60000,label:'Fogata'}];

function toast(t,ms=1400){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
function renderInv(){let s=document.getElementById('slots');s.innerHTML='';for(let i=0;i<8;i++){let d=document.createElement('div');d.className='slot';d.textContent=inv[i]||'';s.appendChild(d)}}
function showInv(){let e=document.getElementById('inventory');e.classList.add('open');renderInv();clearTimeout(invTimer);invTimer=setTimeout(()=>e.classList.remove('open'),2100)}
function addItem(it){if(inv.length>=8){toast('🎒 Inventario lleno');return false}inv.push(it);showInv();toast('+'+it);return true}
function removeItems(req){let a=[...inv];for(const [k,n] of Object.entries(req))for(let i=0;i<n;i++){let q=a.indexOf(k);if(q<0)return false;a.splice(q,1)}inv=a;renderInv();return true}
function useTool(){P.uses--;P.hunger=Math.max(0,P.hunger-2);P.actions++;if(P.actions%5===0)P.energy=Math.max(0,P.energy-(P.thirst<50?40:20));if(P.uses<=0){P.tool=null;toast('💥 Herramienta rota')}}
function nearRes(){let b=null,bd=92;for(const r of resources){if(!r.on)continue;let d=Math.hypot(P.x-r.x,P.y-r.y);if(d<bd){b=r;bd=d}}return b}
function nearStruct(){let b=null,bd=108;for(const s of structures){let d=Math.hypot(P.x-s.x,P.y-s.y);if(d<bd){b=s;bd=d}}return b}
function nearAnything(){if(Math.hypot(P.x-kako.x,P.y-kako.y)<120)return {type:'npc',label:'Kako'};let s=nearStruct();if(s)return {type:'s',obj:s,label:s.label};let r=nearRes();if(r)return {type:'r',obj:r,label:r.label};return null}
function harvest(r){for(const it of r.drop||[])if(!addItem(it))break;r.on=false;r.hits=0;if(r.regen)r.regenAt=performance.now()+r.regen}
function interactAction(){if(Math.hypot(P.x-kako.x,P.y-kako.y)<120){mapUnlocked=true;let d=document.getElementById('dialog');d.style.display='block';d.innerHTML='<b>KAKO</b><p>«No sé de dónde saliste, pero si vas a sobrevivir aquí necesitas saber dónde estás. Toma este mapa.»</p><button onclick="closeDialog()">Aceptar mapa</button>';return}let s=nearStruct();if(s){if(s.type==='workbench'){openCraft();return}if(s.type==='campfire'){cook();return}}let r=nearRes();if(!r){toast('Nada para interactuar');return}if(r.kind==='hand'){harvest(r);return}if(P.tool!==r.kind){toast('Necesitas '+({axe:'🪓 Hacha',pick:'⛏️ Pico',scissors:'✂️ Tijeras'}[r.kind]));return}useTool();r.hits++;toast(P.uses+'/20 usos');if(!r.need||r.hits>=r.need)harvest(r)}
function attackAction(){let d=Math.hypot(P.x-bird.x,P.y-bird.y);if(d<115&&bird.hp>0){bird.hp-=20;bird.agg=true;bird.until=performance.now()+10000;toast('Peacock '+Math.max(0,bird.hp)+'/100');if(bird.hp<=0){bird.agg=false;addItem('Muslito crudo')}}else toast('Sin objetivo')}
function damage(n){P.hp=Math.max(0,P.hp-n);toast('❤️ -'+n);if(P.hp<=0)die()}
function die(){P.deaths++;if(inv.length)resources.push(R('loot',P.x,P.y,{kind:'hand',drop:[...inv],expires:performance.now()+900000,label:'Tus objetos'}));inv=[];P.x=coffin.x;P.y=coffin.y;P.hp=500;spawnAt=performance.now();toast('⚰️ Reapareciste');if(P.deaths>=100){P.deaths=0;P.hunger=P.energy=P.thirst=100;inv=[];toast('100 muertes · reinicio')}}
window.closeDialog=()=>{document.getElementById('dialog').style.display='none';toast('🗺️ Mapa desbloqueado')}
function openCraft(){let e=document.getElementById('craft');e.style.display='block';let items=[['Hacha regular',{'Madera':10,'Cobre':1},()=>equip('axe')],['Pico regular',{'Cobre':8,'Madera':5},()=>equip('pick')],['Tijeras regulares',{'Cobre':5},()=>equip('scissors')],['Fogata',{'Madera':5,'Hierba':5},()=>structures.push({type:'campfire',x:P.x+55,y:P.y,expires:performance.now()+60000,label:'Fogata'})]];window._ci=items;e.innerHTML='<h3>🛠️ Mesa de Trabajo</h3><p>Uso ilimitado.</p>'+items.map((a,i)=>`<div class="crow"><div><b>${a[0]}</b><br><small>${Object.entries(a[1]).map(z=>z[1]+' '+z[0]).join(' · ')}</small></div><button onclick="craft(${i})">Fabricar</button></div>`).join('')+'<button onclick="closeCraft()">Cerrar</button>'}
window.craft=i=>{let a=_ci[i];if(removeItems(a[1])){a[2]();toast('Fabricado: '+a[0])}else toast('Faltan materiales')}
window.closeCraft=()=>document.getElementById('craft').style.display='none';function equip(t){P.tool=t;P.uses=20;P.actions=0}
function cook(){let q=inv.indexOf('Muslito crudo');if(q>=0){inv.splice(q,1);addItem('Muslito cocinado');toast('🔥 Muslito cocinado')}else toast('No tienes carne cruda')}
function openMap(){if(!mapUnlocked){toast('Kako todavía no te dio el mapa');return}document.getElementById('mapPanel').style.display='block'}window.closeMap=()=>document.getElementById('mapPanel').style.display='none';

document.getElementById('interact').onclick=interactAction;document.getElementById('attack').onclick=attackAction;
document.getElementById('invBtn').onclick=()=>{let e=document.getElementById('inventory');e.classList.toggle('open');renderInv()}
document.getElementById('mapBtn').onclick=openMap;document.getElementById('craftBtn').onclick=()=>{if(nearStruct()?.type==='workbench')openCraft();else toast('Acércate a la mesa')}
document.getElementById('run').onpointerdown=()=>runHeld=true;document.getElementById('run').onpointerup=()=>runHeld=false;document.getElementById('run').onpointercancel=()=>runHeld=false;

let J={on:false,id:0,dx:0,dy:0},joy=document.getElementById('joy'),knob=document.getElementById('knob');
function jpos(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=32;if(l>m){dx*=m/l;dy*=m/l}J.dx=dx/m;J.dy=dy/m;knob.style.left=30+dx+'px';knob.style.top=30+dy+'px'}
joy.onpointerdown=e=>{J.on=true;J.id=e.pointerId;joy.setPointerCapture(e.pointerId);jpos(e)};joy.onpointermove=e=>{if(J.on&&e.pointerId===J.id)jpos(e)}
function jend(){J.on=false;J.dx=J.dy=0;knob.style.left='30px';knob.style.top='30px'}joy.onpointerup=jend;joy.onpointercancel=jend;

const ptr=new Map();canvas.onpointerdown=e=>ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.onpointermove=e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){let p=[...ptr.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,dd=Math.hypot(dx,dy),aa=Math.atan2(dy,dx);if(canvas._pd){cam.zoom=Math.max(.78,Math.min(1.28,cam.zoom*dd/canvas._pd));let da=aa-canvas._pa;if(Math.abs(da)<.3)cam.rot+=da}canvas._pd=dd;canvas._pa=aa}};function pend(e){ptr.delete(e.pointerId);if(ptr.size<2){canvas._pd=null;canvas._pa=null}}canvas.onpointerup=pend;canvas.onpointercancel=pend;

function update(dt,now){
 for(const r of resources){if(!r.on&&r.regenAt&&now>=r.regenAt){r.on=true;r.regenAt=0}if(r.expires&&now>=r.expires)r.on=false}
 thA+=dt;huA+=dt;if(thA>=60000){thA-=60000;P.thirst=Math.max(0,P.thirst-10)}if(huA>=15000){huA-=15000;P.hunger=Math.max(0,P.hunger-1)}if(P.hunger<=0){starveA+=dt;if(starveA>=60000){starveA-=60000;damage(100)}}else starveA=0;
 let dx=J.dx,dy=J.dy,l=Math.hypot(dx,dy);if(l>.05){P.walk+=dt*.012;P.face=dx<-.1?-1:dx>.1?1:P.face;let good=P.hp>50&&P.hunger>50&&P.energy>50&&P.thirst>50,v=(runHeld&&good)?50:30,sp=v*2.6*dt/1000,ca=Math.cos(-cam.rot),sa=Math.sin(-cam.rot);P.x=Math.max(80,Math.min(W.w-80,P.x+(dx*ca-dy*sa)*sp));P.y=Math.max(80,Math.min(W.h-80,P.y+(dx*sa+dy*ca)*sp))}
 cam.tx=P.x;cam.ty=P.y;let k=1-Math.pow(.001,dt/1000);cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;
 if(bird.hp>0){let d=Math.hypot(P.x-bird.x,P.y-bird.y);if(bird.agg){if(now>bird.until||d>520)bird.agg=false;else{let a=Math.atan2(P.y-bird.y,P.x-bird.x),sp=28*2.2*dt/1000;bird.x+=Math.cos(a)*sp;bird.y+=Math.sin(a)*sp;if(d<58&&now-bird.last>1300){bird.last=now;damage(20)}}}else{let bs=resources.filter(r=>r.type==='berry_bush'&&r.on).sort((a,b)=>Math.hypot(bird.x-a.x,bird.y-a.y)-Math.hypot(bird.x-b.x,bird.y-b.y))[0];if(bs){let d=Math.hypot(bird.x-bs.x,bird.y-bs.y);if(d>50){let a=Math.atan2(bs.y-bird.y,bs.x-bird.x);bird.x+=Math.cos(a)*10*dt/1000;bird.y+=Math.sin(a)*10*dt/1000}else if(now-bird.last>5000){bird.last=now;bs.on=false;bs.regenAt=now+600000}}}}
 let n=nearAnything(),lab=document.getElementById('nearLabel');if(n){lab.textContent='🖐️ '+n.label;lab.classList.add('show')}else lab.classList.remove('show');
}
function sprite(im,x,y,w,h,flip=1,bob=0){if(!(im.complete&&im.naturalWidth))return;ctx.save();ctx.translate(x,y+bob);ctx.scale(flip,1);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}
function shadow(x,y,w,a=.22){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.ellipse(x,y,w,7,0,0,Math.PI*2);ctx.fill()}
function grassTuft(x,y,s=1){ctx.strokeStyle='#334830';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+(i-2)*4*s,y-12*s,x+(i-2)*7*s,y-20*s);ctx.stroke()}}
function draw(now){
 ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(innerWidth/2,innerHeight/2);ctx.rotate(cam.rot);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);
 // terrain base + organic texture
 ctx.fillStyle='#70805c';ctx.fillRect(0,0,W.w,W.h);
 ctx.globalAlpha=.22;
 for(let i=0;i<46;i++){let xx=700+(i*197)%1900,yy=300+(i*337)%1700;ctx.fillStyle=i%3===0?'#4e6748':'#607550';ctx.beginPath();ctx.ellipse(xx,yy,150+(i%5)*28,90+(i%4)*20,(i%7)*.17,0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=1;
 for(let i=0;i<75;i++)grassTuft((i*173)%2500+400,(i*311)%1700+260,.55+(i%3)*.2);
 // river
 ctx.fillStyle='#4f7d82';ctx.beginPath();ctx.moveTo(2680,0);ctx.bezierCurveTo(2400,520,2890,1110,2530,2400);ctx.lineTo(3600,2400);ctx.lineTo(3600,0);ctx.closePath();ctx.fill();

 // distant mountains
 ctx.fillStyle='#4a5148';for(let i=0;i<9;i++){let xx=2480+i*120;ctx.beginPath();ctx.moveTo(xx,360);ctx.lineTo(xx+60,140-(i%3)*32);ctx.lineTo(xx+130,360);ctx.fill()}

 // z-sorted world objects
 let objs=[];for(const r of resources)if(r.on)objs.push({k:'r',y:r.y,o:r});for(const s of structures)if(!(s.type==='campfire'&&now>s.expires))objs.push({k:'s',y:s.y,o:s});objs.push({k:'k',y:kako.y,o:kako});if(bird.hp>0)objs.push({k:'b',y:bird.y,o:bird});objs.push({k:'p',y:P.y,o:P});objs.sort((a,b)=>a.y-b.y);
 for(const q of objs){

   if(q.k==='p'){let bob=Math.sin(P.walk)*2.2,age=(now-spawnAt)/1000,rise=Math.max(0,Math.min(1,age/1.1));shadow(P.x,P.y+8,24,.24);sprite(A.raven,P.x,P.y+18+(1-rise)*28,76,104*rise+18,P.face,bob)}
 }

 let p=((now-day0)/300000)%1,d=p<.58?0:p<.75?(p-.58)/.17*.38:p<.9?.38:.38*(1-(p-.9)/.1);if(d>0){ctx.fillStyle=`rgba(8,12,24,${d})`;ctx.fillRect(0,0,innerWidth,innerHeight)}

function hud(now){hp.textContent=Math.round(P.hp);hunger.textContent=Math.round(P.hunger);energy.textContent=Math.round(P.energy);thirst.textContent=Math.round(P.thirst);deaths.textContent=P.deaths+'/100';let sec=(now-day0)/1000,d=Math.floor(sec/300)+1,p=(sec%300)/300,part=p<.18?'Mañana':p<.58?'Día':p<.75?'Tarde':'Noche';day.textContent='Día '+d+' · '+part+(P.tool?' · '+({axe:'🪓',pick:'⛏️',scissors:'✂️'}[P.tool])+' '+P.uses+'/20':'')}
function loop(now){if(started){let dt=Math.min(40,now-last);last=now;update(dt,now);draw(now);hud(now)}requestAnimationFrame(loop)}requestAnimationFrame(loop);

document.getElementById('splash').style.backgroundImage="url('loading.jpeg')";
let f=0,t=setInterval(()=>{f+=10;loadfill.style.width=f+'%';if(f>=100){clearInterval(t);setTimeout(()=>{splash.style.display='none';start.style.display='flex'},250)}},100);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{P.tool=b.dataset.tool;P.uses=20;start.style.display='none';started=true;last=performance.now();spawnAt=performance.now();toast('⚰️ Despertaste en el Mundo 1')});
