<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YOU CAN'T DIE — Visual Slice v0.5</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f0c;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#1a2018}
#rotate{position:fixed;inset:0;z-index:200;background:#15120f;display:none;align-items:center;justify-content:center;text-align:center;padding:28px}
#rotate .box{max-width:430px;background:#211a14;border:2px solid #766247;border-radius:20px;padding:22px}
#rotate .phone{display:block;font-size:60px;transform:rotate(90deg);margin:10px}
#splash{position:fixed;inset:0;z-index:180;background:#10120f;display:flex;align-items:center;justify-content:center}
#splash .card{width:min(520px,65vw);background:#17140fe8;border:1px solid #746247;border-radius:18px;padding:20px;text-align:center}
.logo{font:700 30px Georgia,serif;letter-spacing:2px;margin-bottom:12px}
.bar{height:9px;border:1px solid #cbb88f;border-radius:12px;background:#282118;overflow:hidden}
.fill{height:100%;width:0;background:#cbb88f;transition:width .12s}
#hud{position:fixed;inset:0;z-index:50;pointer-events:none}
#stats{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:6px}
.stat{height:36px;min-width:63px;background:#17140fcf;border:1px solid #6f5e46;border-radius:11px;display:flex;align-items:center;gap:5px;padding:4px 7px;font:700 11px system-ui}
#title{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));background:#17140fc7;border:1px solid #6f5e46;border-radius:11px;padding:7px 10px;font:700 11px system-ui}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:#15201866;border:2px solid #c0ab7a55;pointer-events:auto}
#knob{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:#b69f72cc;border:2px solid #221b14}
#actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.action{width:58px;height:58px;border-radius:50%;border:1px solid #806b4f;background:#18140fe0;color:#eee;font-size:25px}
.action:active{transform:scale(.96)}
#near{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#17130fd9;border:1px solid #725f46;border-radius:10px;padding:6px 10px;font:11px system-ui;opacity:0;transition:.15s}
#near.show{opacity:1}
#inventory{position:fixed;left:50%;bottom:14px;transform:translate(-50%,140%);z-index:90;background:#17130ff0;border:1px solid #79654b;border-radius:12px;padding:7px;transition:.2s}
#inventory.open{transform:translate(-50%,0)}
#slots{display:grid;grid-template-columns:repeat(8,44px);gap:5px}
.slot{width:44px;height:44px;border:1px dashed #736249;border-radius:7px;background:#282119;display:flex;align-items:center;justify-content:center;text-align:center;font:9px system-ui;padding:2px}
#toast{position:fixed;z-index:100;left:50%;bottom:76px;transform:translateX(-50%);background:#15120eea;border:1px solid #725f46;border-radius:10px;padding:7px 11px;font:11px system-ui;opacity:0;transition:.2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="rotate"><div class="box"><span class="phone">📱</span><h2>Vira el teléfono</h2><p>Esta prueba está diseñada para jugarse en horizontal.</p></div></div>
<canvas id="game"></canvas>
<div id="splash"><div class="card"><div class="logo">YOU CAN'T DIE</div><div style="margin-bottom:9px">Cargando prueba visual...</div><div class="bar"><div id="fill" class="fill"></div></div></div></div>

<div id="hud">
<div id="title">Prueba visual · Bosque de moras</div>
<div id="stats">
<div class="stat">❤️ 500</div><div class="stat">🍖 100</div><div class="stat">⚡ 100</div><div class="stat">💧 100</div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="actions"><button id="interact" class="action">🖐️</button><button id="inventoryBtn" class="action">🧰</button></div>
<div id="near"></div>
</div>
<div id="inventory"><div id="slots"></div></div>
<div id="toast"></div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  canvas.width=innerWidth*DPR; canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  document.getElementById('rotate').style.display=innerHeight>innerWidth?'flex':'none';
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

const world={w:3200,h:1800};
const terrain=new Image();terrain.src='terrain_world.jpg';
const frames={raven:{},peacock:{},berry:{}};
const dirs=['front','right','back'];
const loads=[];
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src})}
async function loadAll(){
  for(const d of dirs){
    frames.raven[d]=[];
    frames.peacock[d]=[];
    for(let i=0;i<4;i++){
      frames.raven[d].push(await loadImg(`raven_${d}_${i}.png`));
      frames.peacock[d].push(await loadImg(`peacock_${d}_${i}.png`));
    }
  }
  frames.berry.wind=[];frames.berry.harvest=[];
  for(let i=0;i<4;i++){
    frames.berry.wind.push(await loadImg(`berry_wind_${i}.png`));
    frames.berry.harvest.push(await loadImg(`berry_harvest_${i}.png`));
  }
  if(!terrain.complete) await new Promise(r=>terrain.onload=r);
}
let P={x:650,y:920,dir:'front',flip:1,moving:false,frame:0,animT:0};
let cam={x:P.x,y:P.y};
let inv=[],invTimer;
const bushes=[
  {x:1050,y:820,berries:true,state:'wind',animT:0,frame:0},
  {x:1320,y:1080,berries:true,state:'wind',animT:600,frame:1},
  {x:1650,y:760,berries:true,state:'wind',animT:1100,frame:2},
  {x:1960,y:1160,berries:true,state:'wind',animT:300,frame:3},
  {x:2300,y:860,berries:true,state:'wind',animT:850,frame:1}
];
let bird={x:1450,y:880,dir:'right',flip:1,frame:0,animT:0,target:0,wait:0};
let started=false,last=performance.now();

function toast(t,ms=1300){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
function renderInv(){const s=document.getElementById('slots');s.innerHTML='';for(let i=0;i<8;i++){const q=document.createElement('div');q.className='slot';q.textContent=inv[i]||'';s.appendChild(q)}}
function showInv(){const e=document.getElementById('inventory');e.classList.add('open');renderInv();clearTimeout(invTimer);invTimer=setTimeout(()=>e.classList.remove('open'),1800)}
function addItem(it){if(inv.length>=8){toast('Inventario lleno');return false}inv.push(it);showInv();return true}
document.getElementById('inventoryBtn').onclick=()=>{const e=document.getElementById('inventory');e.classList.toggle('open');renderInv()};

function nearestBush(){
  let b=null,bd=115;
  for(const x of bushes){const d=Math.hypot(P.x-x.x,P.y-x.y);if(d<bd){bd=d;b=x}}
  return b;
}
document.getElementById('interact').onclick=()=>{
  const b=nearestBush();
  if(!b){toast('No hay nada para recoger');return}
  if(!b.berries){toast('Este arbusto ya no tiene moras');return}
  b.state='harvest';b.animT=0;b.frame=0;b.berries=false;
  let added=0;for(let i=0;i<3;i++) if(addItem('Mora')) added++;
  toast(`🫐 Recogiste ${added} moras`);
};

let J={active:false,id:null,dx:0,dy:0};
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function setJoy(e){
  const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=32;
  if(l>m){dx*=m/l;dy*=m/l}
  J.dx=dx/m;J.dy=dy/m;knob.style.left=31+dx+'px';knob.style.top=31+dy+'px';
}
joy.onpointerdown=e=>{J.active=true;J.id=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)};
joy.onpointermove=e=>{if(J.active&&e.pointerId===J.id)setJoy(e)};
function stopJoy(){J.active=false;J.dx=J.dy=0;knob.style.left='31px';knob.style.top='31px'}
joy.onpointerup=stopJoy;joy.onpointercancel=stopJoy;

function updateDir(dx,dy){
  if(Math.abs(dx)>Math.abs(dy)){
    P.dir='right';P.flip=dx<0?-1:1;
  }else{
    P.dir=dy<0?'back':'front';P.flip=1;
  }
}
function update(dt){
  const dx=J.dx,dy=J.dy,l=Math.hypot(dx,dy);
  P.moving=l>.08;
  if(P.moving){
    updateDir(dx,dy);
    const sp=112*dt/1000;
    P.x=Math.max(80,Math.min(world.w-80,P.x+dx*sp));
    P.y=Math.max(80,Math.min(world.h-80,P.y+dy*sp));
    P.animT+=dt;
    if(P.animT>125){P.animT-=125;P.frame=(P.frame+1)%4}
  }else{P.frame=0;P.animT=0}
  const k=1-Math.pow(.002,dt/1000);cam.x+=(P.x-cam.x)*k;cam.y+=(P.y-cam.y)*k;

  // bushes: slow wind loop; harvest plays once and freezes berry-less
  for(const b of bushes){
    b.animT+=dt;
    if(b.state==='wind'){
      if(b.animT>650){b.animT-=650;b.frame=(b.frame+1)%4}
    }else if(b.state==='harvest'){
      if(b.animT>120){b.animT-=120;b.frame++;if(b.frame>=4){b.frame=3;b.state='empty'}}
    }
  }

  // Peacock calmly walks between bushes and pauses to peck
  if(bird.wait>0){bird.wait-=dt;bird.frame=0}
  else{
    const target=bushes[bird.target%bushes.length];
    let dx=target.x-bird.x,dy=target.y-bird.y,d=Math.hypot(dx,dy);
    if(d<75){bird.wait=1600;bird.target=(bird.target+1)%bushes.length}
    else{
      dx/=d;dy/=d;
      if(Math.abs(dx)>Math.abs(dy)){bird.dir='right';bird.flip=dx<0?-1:1}else{bird.dir=dy<0?'back':'front';bird.flip=1}
      const sp=52*dt/1000;bird.x+=dx*sp;bird.y+=dy*sp;
      bird.animT+=dt;if(bird.animT>165){bird.animT-=165;bird.frame=(bird.frame+1)%4}
    }
  }
  const nb=nearestBush(),lab=document.getElementById('near');
  if(nb){lab.textContent=nb.berries?'🖐️ Recoger moras':'Arbusto sin moras';lab.classList.add('show')} else lab.classList.remove('show');
}

function drawSprite(img,x,y,h,flip=1,bob=0){
  if(!img||!img.naturalWidth)return;
  const scale=h/img.naturalHeight,w=img.naturalWidth*scale;
  ctx.save();ctx.translate(x,y+bob);ctx.scale(flip,1);ctx.drawImage(img,-w/2,-h,w,h);ctx.restore();
}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y,w,8,0,0,Math.PI*2);ctx.fill()}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const sx=innerWidth/2-cam.x,sy=innerHeight/2-cam.y;
  ctx.save();ctx.translate(sx,sy);
  ctx.drawImage(terrain,0,0,world.w,world.h);

  // subtle vignette on world edges
  ctx.strokeStyle='rgba(16,20,14,.18)';ctx.lineWidth=80;ctx.strokeRect(0,0,world.w,world.h);

  // y-sort all sprites for clean 2D depth
  const objs=[];
  bushes.forEach(b=>objs.push({y:b.y,type:'bush',o:b}));
  objs.push({y:bird.y,type:'bird',o:bird});
  objs.push({y:P.y,type:'player',o:P});
  objs.sort((a,b)=>a.y-b.y);

  for(const q of objs){
    if(q.type==='bush'){
      const b=q.o;shadow(b.x,b.y+8,34);
      const arr=b.state==='wind'?frames.berry.wind:frames.berry.harvest;
      drawSprite(arr[Math.min(3,b.frame)],b.x,b.y+10,104,1,0);
    }else if(q.type==='bird'){
      shadow(bird.x,bird.y+7,25);
      const bob=bird.wait>0?0:Math.sin(bird.frame*Math.PI/2)*1.5;
      drawSprite(frames.peacock[bird.dir][bird.frame],bird.x,bird.y+8,86,bird.flip,bob);
    }else{
      shadow(P.x,P.y+7,27);
      const bob=P.moving?Math.sin(P.frame*Math.PI/2)*1.3:0;
      drawSprite(frames.raven[P.dir][P.frame],P.x,P.y+8,126,P.flip,bob);
    }
  }
  ctx.restore();
}
function loop(now){
  if(started){const dt=Math.min(40,now-last);last=now;update(dt);draw()}
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

(async()=>{
  let f=0,t=setInterval(()=>{f=Math.min(90,f+10);document.getElementById('fill').style.width=f+'%'},90);
  await loadAll();clearInterval(t);document.getElementById('fill').style.width='100%';
  setTimeout(()=>{document.getElementById('splash').style.display='none';started=true;last=performance.now();toast('Mueve a Raven y acércate a un arbusto')},250);
})();
</script>
</body>
</html>
